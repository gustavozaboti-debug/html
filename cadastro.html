<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Cadastro </title>
</head>
<body>
    <form id="formCadastro">
        <h2> Cadastrar usuário </h2>
        <input type ="text" id="novoUsuario" placeholder="Novo Usuário" required>
        <input type="password" id="novaSenha" placeholder="Nova Senha" required>
        <button type="submit"> Concluir cadastro </button>
        <button type="button" id="btnVoltarHome" class="btn-secundario"> Voltar </button>
    </form>

    <script src="script.js"></script>
    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado')
        if(!usuarioLogado){
            window.location.href = 'index.html';
        }

        document.getElementById('btnVoltarHome').addEventListener('click', function (){
            window.location.href = 'home.html';
        })
    </script>
</body>
</html>
