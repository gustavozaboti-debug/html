<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <class="card">
        <h2> Criar Conta </h2>

        <div class="form-group">
            <label for="nome"> Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="nascimento"> Data de nascimento</label>
            <input type="date" id="nascimento">
        </div> 

        <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>

    <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" placeholder="(00) 00000-0000">
    </div>
    
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email">
    </div>

    <button type="button" class="btn-principal" id="btnSalvar">Cadastrar</button>
    <a href="index.html" class="btn-secundario">Voltar para o Login</a>

    <div class="mensagem" id="mensagemCadastro"></div>
</div>
<script src="cadastro.js"></script>
</body>
</html>
