<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Academia</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>

    <div class="card-home">
        <h2>Academia do Big Carl Johnson</h2>
        <p id="mensagemBoasVindas">Bem Vindo!</p>
        <p>Treino Liberado.</p>

        <button type="button" id="btnVerTreinos">Ver Treinos</button>
        <button type="button" id="btnCadastrarUsuario"> Cadastrar </button>
        <button type="button" id="btnSair">Sair</button>
    </div>

    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');

        if (!usuarioLogado) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('mensagemBoasVindas').textContent = 'Bem vindo, ' + usuarioLogado + '!';
        }

        document.getElementById('btnVerTreinos').addEventListener('click', function () {
            window.location.href = 'treino.html';
        });
        document.getElementById('btnCadastrarUsuario').addEventListener('click', function(){
            window.location.href="Cadastro.html";
        })

        document.getElementById('btnSair').addEventListener('click', function () {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html';
        });
    </script>
</body>  
</html>
